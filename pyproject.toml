[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intelligence-system"
version = "0.1.0"
description = "Private, model-independent intelligence pipeline for ai_deepdive"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-intel = "intelligence.cli:main"

[tool.setuptools]
packages = ["intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
