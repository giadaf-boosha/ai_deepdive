# config/sources.yaml — ai_deepdive
# Lista canonica delle fonti monitorate dalla routine giornaliera.
# Ultima revisione: 2026-05-31
# Modifica questo file e committa per aggiornare le fonti della routine.

# Convenzioni:
# - type: "rss" se feed RSS canonico, "substack_rss" se Substack /feed,
#   "html" se solo scraping HTML dell'archive
# - paywall: false | partial | full
# - priority: high | medium | low (la routine prioritizza high in caso di rate limit)

newsletters:
  - name: AlphaSignal
    url: https://alphasignal.ai/archive
    rss: https://alphasignalai.substack.com/feed
    type: substack_rss
    priority: high
    paywall: false
    language: en
    notes: "Daily AI news digest (Lior Sinclair). Sintesi quotidiana di papers, modelli, repo. Feed canonico ufficiale e' la versione Substack; alphasignal.ai/feed.xml restituisce 403."

  - name: Hugging Face Papers
    url: https://huggingface.co/papers
    rss: null
    type: html
    priority: high
    paywall: false
    language: en
    notes: "Paper trending giornalieri. La pagina del giorno e' huggingface.co/papers/date/YYYY-MM-DD: scraping HTML di quella data, coprire tutti i paper elencati come base per la sezione Paper & ricerca (poi selezione editoriale per il digest)."

  - name: Simon Willison's Weblog
    url: https://simonwillison.net/
    rss: https://simonwillison.net/atom/everything/
    type: rss
    priority: high
    paywall: false
    language: en
    notes: "Atom feed completo (entries + linkblog). Riferimento per LLM tooling, prompting, ecosistema OSS."

  - name: Every
    url: https://every.to
    rss: null
    type: html
    priority: high
    paywall: partial
    language: en
    notes: "Network di newsletter (Dan Shipper et al.). Nessun feed unico pubblico verificato (every.to/feed e /feed.xml e /atom.xml ritornano 404). Scraping HTML dell'homepage o per autore."

  - name: AI Snake Oil
    url: https://www.aisnakeoil.com
    rss: https://www.normaltech.ai/feed
    type: substack_rss
    priority: high
    paywall: false
    language: en
    notes: "Arvind Narayanan + Sayash Kapoor. La pubblicazione si e' rinominata in 'AI as Normal Technology' (normaltech.ai); il vecchio dominio aisnakeoil.com fa 301 redirect."

  - name: One Useful Thing
    url: https://www.oneusefulthing.org
    rss: https://www.oneusefulthing.org/feed
    type: substack_rss
    priority: high
    paywall: false
    language: en
    notes: "Ethan Mollick. Implicazioni AI su lavoro e formazione, prompting pratico."

  - name: Exponential View
    url: https://www.exponentialview.co
    rss: https://www.exponentialview.co/feed
    type: substack_rss
    priority: high
    paywall: partial
    language: en
    notes: "Azeem Azhar. Analisi macro AI/tech. Alcuni post premium-only."

  - name: Ben's Bites
    url: https://www.bensbites.com
    rss: https://www.bensbites.com/feed
    type: rss
    priority: high
    paywall: false
    language: en
    notes: "Daily AI roundup. Domain principale e' bensbites.com (bensbites.beehiiv.com restituisce 404 sul feed)."

  - name: Unwind AI
    url: https://unwindai.substack.com
    rss: https://unwindai.substack.com/feed
    type: substack_rss
    priority: medium
    paywall: false
    language: en
    notes: "Tutorial e tool AI lato sviluppatore."

  - name: Daily Dose of Data Science
    url: https://www.dailydoseofds.com
    rss: https://www.dailydoseofds.com/rss/
    type: rss
    priority: medium
    paywall: partial
    language: en
    notes: "Avi Chawla. Deep dive tecnici DS/ML/RL, alcuni post solo paid."

  - name: Cobus Greyling
    url: https://cobusgreyling.substack.com
    rss: https://cobusgreyling.substack.com/feed
    type: substack_rss
    priority: medium
    paywall: false
    language: en
    notes: "LLM, agenti, NLU/NLP. Pubblica spesso, taglio applicato."

  - name: Interconnects (ex Robotic)
    url: https://www.interconnects.ai
    rss: https://www.interconnects.ai/feed
    type: substack_rss
    priority: medium
    paywall: partial
    language: en
    notes: "Nathan Lambert (AI2). robotic.substack.com fa 301 a interconnects.ai. Approfondimenti su frontier models e RLHF."

  - name: LLM Watch (ex The Week in AI / XaiGuy)
    url: https://www.llmwatch.com
    rss: https://www.llmwatch.com/feed
    type: substack_rss
    priority: medium
    paywall: false
    language: en
    notes: "Pascal Biese. Sintesi settimanale dei paper LLM piu' rilevanti. xaiguy.substack.com fa 301 al nuovo dominio."

  - name: Andreas' Newsletter
    url: https://andreas.substack.com
    rss: https://andreas.substack.com/feed
    type: substack_rss
    priority: medium
    paywall: false
    language: en
    notes: "URL non verificato univocamente — il riferimento dell'utente e' ambiguo. Fallback: lasciare type substack_rss; se la routine non trova items per >7 giorni, segnalare per revisione manuale dell'handle."

  - name: G Huntley
    url: https://ghuntley.com
    rss: https://ghuntley.com/rss/
    type: rss
    priority: medium
    paywall: false
    language: en
    notes: "Geoffrey Huntley. AI engineering, automazione SDE, DevEx."

  - name: Behind the Craft (Peter Yang)
    url: https://creatoreconomy.so
    rss: https://creatoreconomy.so/feed
    type: substack_rss
    priority: medium
    paywall: partial
    language: en
    notes: "Peter Yang. peteryang.substack.com fa 301 a creatoreconomy.so / 'Behind the Craft'. Product + AI applicato."

  - name: Data Pizza
    url: https://datapizza.tech
    rss: null
    type: html
    priority: medium
    paywall: false
    language: it
    notes: "Datapizza (community italiana data/AI). Domini datapizza.it e datapizza.tech non espongono feed RSS verificato (404 su /feed). Scraping HTML dell'archive blog."

  - name: TechCrunch (Artificial Intelligence)
    url: https://techcrunch.com/category/artificial-intelligence/
    rss: https://techcrunch.com/category/artificial-intelligence/feed/
    type: rss
    priority: medium
    paywall: partial
    language: en
    notes: "Categoria AI dedicata: monitorare tutti gli articoli pubblicati nella categoria nelle ultime 24 ore come base per Tool & prodotti / Business & strategia (poi selezione editoriale). Alcuni articoli con paywall TechCrunch+."

  - name: The Information
    url: https://www.theinformation.com
    rss: null
    type: html
    priority: low
    paywall: full
    language: en
    notes: "Paywall totale. La routine puo' loggare solo titoli/teaser dalla home; serve abbonamento per il corpo."

